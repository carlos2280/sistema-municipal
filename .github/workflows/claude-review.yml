# ============================================
# Sistema Municipal - Claude Code Review
# ============================================
# Ejecuta review automatico con Claude en PRs
# Claude carga automaticamente CLAUDE.md, rules/,
# settings.json, skills/ y agents/ del repo.
# ============================================

name: Claude Review

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  claude-review:
    name: Claude Code Review
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > /tmp/pr-diff.txt
          echo "lines=$(wc -l < /tmp/pr-diff.txt)" >> $GITHUB_OUTPUT

      - name: Run Claude Review
        if: steps.diff.outputs.lines > 0
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          PROMPT="Revisa los cambios del PR #${{ github.event.pull_request.number }} (${{ github.event.pull_request.title }}). Ejecuta: gh pr diff ${{ github.event.pull_request.number }} para ver el diff. Lee CLAUDE.md y las rules del proyecto. Reporta: [CRITICO] archivo:linea (bloquea merge), [WARNING] (sugerir mejora), [SUGERENCIA] (opcional). Prioridades: seguridad, TypeScript zero any, Atomic Design, Zod validation, no hardcodear colores. Se breve."

          claude -p "$PROMPT" \
            --dangerously-skip-permissions \
            --output-format text > /tmp/review-result.txt

      - name: Comment on PR
        if: always() && steps.diff.outputs.lines > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REVIEW=$(cat /tmp/review-result.txt 2>/dev/null || echo "Review no pudo ejecutarse")

          gh pr comment ${{ github.event.pull_request.number }} \
            --body "## 🔍 Claude Code Review

          $REVIEW

          ---
          *Review automatico — Claude carga las rules del proyecto automaticamente*"
