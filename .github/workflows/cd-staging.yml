# ============================================
# Sistema Municipal - CD Staging Pipeline
# ============================================
# Railway tiene integración directa con GitHub y despliega
# automáticamente al detectar push en la rama develop.
# Este workflow solo verifica qué cambió y notifica el resultado.
# ============================================

name: CD Staging

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  # ============================================
  # Detectar cambios por servicio
  # ============================================
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      apis: ${{ steps.changes.outputs.apis }}
      microfrontends: ${{ steps.changes.outputs.microfrontends }}
      packages: ${{ steps.changes.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            apis:
              - 'apps/microservices/**'
            microfrontends:
              - 'apps/microfrontends/**'
            packages:
              - 'packages/**'

  # ============================================
  # Resumen de deploy (Railway lo hace automáticamente)
  # ============================================
  summary:
    name: Deploy Summary
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Summary
        run: |
          echo "## 🚀 Railway Staging Deploy" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Railway detectó el push a **develop** y está desplegando automáticamente a staging." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Cambios detectados" >> $GITHUB_STEP_SUMMARY
          echo "| Área | Cambió |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Microservicios (APIs) | ${{ needs.detect-changes.outputs.apis }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Microfrontends | ${{ needs.detect-changes.outputs.microfrontends }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Packages compartidos | ${{ needs.detect-changes.outputs.packages }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Verifica el estado en [Railway Dashboard](https://railway.app/project/8d4f52bd-6e36-4d06-8d5a-c15bc649b9ed)" >> $GITHUB_STEP_SUMMARY
