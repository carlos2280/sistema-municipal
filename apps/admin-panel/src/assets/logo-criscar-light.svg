<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="gradMainL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6edf5"/>
      <stop offset="50%" stop-color="#c2d4e8"/>
      <stop offset="100%" stop-color="#e0f7fa"/>
    </linearGradient>
    <linearGradient id="gradReverseL" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="40%" stop-color="#3768ab"/>
      <stop offset="100%" stop-color="#0f2248"/>
    </linearGradient>
    <radialGradient id="glowCyanL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00bcd4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#00bcd4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gradGlassL" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(55,104,171,0.2)"/>
      <stop offset="100%" stop-color="rgba(0,188,212,0.15)"/>
    </linearGradient>
    <filter id="glowL" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowStrongL" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="circuitL" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="20" x2="40" y2="20" stroke="#3768ab" stroke-opacity="0.06" stroke-width="0.5"/>
      <line x1="20" y1="0" x2="20" y2="40" stroke="#3768ab" stroke-opacity="0.06" stroke-width="0.5"/>
      <circle cx="20" cy="20" r="1.5" fill="#3768ab" fill-opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Fondo light -->
  <rect width="400" height="400" rx="32" fill="#f8fafc"/>

  <!-- Glow ambiental -->
  <ellipse cx="160" cy="170" rx="120" ry="120" fill="url(#glowCyanL)" opacity="0.7"/>
  <ellipse cx="260" cy="250" rx="100" ry="100" fill="#3768ab" opacity="0.04"/>

  <!-- Hexágono -->
  <g transform="translate(200,200)">
    <polygon points="0,-172 149,-86 149,86 0,172 -149,86 -149,-86"
             fill="#0C1120" opacity="0.03" transform="translate(3,5)"/>
    <polygon points="0,-172 149,-86 149,86 0,172 -149,86 -149,-86"
             fill="url(#gradMainL)" stroke="url(#gradGlassL)" stroke-width="1.5"/>
    <polygon points="0,-172 149,-86 149,86 0,172 -149,86 -149,-86"
             fill="url(#circuitL)"/>
    <line x1="-130" y1="-78" x2="130" y2="-78"
          stroke="white" stroke-opacity="0.5" stroke-width="1" stroke-linecap="round"/>
  </g>

  <!-- Hexágono interior -->
  <g transform="translate(200,200)">
    <polygon points="0,-138 120,-69 120,69 0,138 -120,69 -120,-69"
             fill="none" stroke="#3768ab" stroke-opacity="0.15" stroke-width="0.75"/>
  </g>

  <!-- Monograma C&C -->
  <g transform="translate(200,200)" filter="url(#glowL)">
    <g transform="translate(-38, 0)">
      <path d="M 30,-52 C -5,-52 -32,-30 -32,0 C -32,30 -5,52 30,52"
            fill="none" stroke="#3768ab" stroke-width="7" stroke-linecap="round"/>
      <path d="M 30,-52 L 18,-42 L 30,-32"
            fill="none" stroke="#3768ab" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
      <path d="M 30,52 L 42,42 L 30,32"
            fill="none" stroke="#3768ab" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
      <line x1="25" y1="-20" x2="10" y2="20"
            stroke="#3768ab" stroke-width="2.5" stroke-linecap="round" opacity="0.3"/>
    </g>
    <g transform="translate(38, 0) scale(-1,1)">
      <path d="M 30,-52 C -5,-52 -32,-30 -32,0 C -32,30 -5,52 30,52"
            fill="none" stroke="#0f2248" stroke-width="7" stroke-linecap="round"/>
      <g transform="translate(30,-52) scale(0.6)" opacity="0.7">
        <line x1="0" y1="-8" x2="0" y2="8" stroke="#0f2248" stroke-width="3" stroke-linecap="round"/>
        <path d="M 5,-4 C 5,-7 -5,-7 -5,-4 C -5,-1 5,-1 5,2 C 5,5 -5,5 -5,2"
              fill="none" stroke="#0f2248" stroke-width="2.5" stroke-linecap="round"/>
      </g>
      <g transform="translate(22, 42)" opacity="0.5">
        <line x1="0" y1="0" x2="16" y2="0" stroke="#0f2248" stroke-width="2" stroke-linecap="round"/>
        <line x1="0" y1="6" x2="16" y2="6" stroke="#0f2248" stroke-width="2" stroke-linecap="round"/>
        <line x1="10" y1="-3" x2="10" y2="9" stroke="#0f2248" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </g>
    <circle cx="0" cy="0" r="5" fill="#3768ab" filter="url(#glowStrongL)"/>
    <circle cx="0" cy="0" r="2.5" fill="#0f2248"/>
    <line x1="-8" y1="0" x2="8" y2="0"
          stroke="#3768ab" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- Anillo orbital -->
  <g transform="translate(200,200)">
    <ellipse cx="0" cy="0" rx="105" ry="30"
             fill="none" stroke="url(#gradReverseL)" stroke-width="1.5"
             transform="rotate(-25)" opacity="0.25"/>
    <circle cx="95" cy="-32" r="3" fill="#00bcd4" opacity="0.5"/>
    <circle cx="-88" cy="38" r="2" fill="#3768ab" opacity="0.3"/>
  </g>

  <!-- Texto -->
  <g transform="translate(200, 340)">
    <line x1="-60" y1="-12" x2="-20" y2="-12" stroke="#3768ab" stroke-opacity="0.2" stroke-width="1"/>
    <line x1="20" y1="-12" x2="60" y2="-12" stroke="#3768ab" stroke-opacity="0.2" stroke-width="1"/>
    <circle cx="0" cy="-12" r="2" fill="#3768ab" opacity="0.3"/>
    <text text-anchor="middle" y="6"
          font-family="Geist, Inter, system-ui, sans-serif" font-size="13" font-weight="600"
          letter-spacing="4" fill="#1c3970">C &amp; C</text>
    <text text-anchor="middle" y="22"
          font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="400"
          letter-spacing="2.5" fill="#64748b">SYSTEMS</text>
  </g>

  <!-- Partículas -->
  <circle cx="85" cy="95" r="1.5" fill="#3768ab" opacity="0.15"/>
  <circle cx="320" cy="120" r="1" fill="#00bcd4" opacity="0.15"/>
  <circle cx="70" cy="290" r="1.2" fill="#3768ab" opacity="0.15"/>
  <circle cx="340" cy="310" r="1.8" fill="#00bcd4" opacity="0.1"/>
</svg>