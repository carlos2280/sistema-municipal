<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48">
  <defs>
    <linearGradient id="gM" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2248"/>
      <stop offset="50%" stop-color="#3768ab"/>
      <stop offset="100%" stop-color="#00bcd4"/>
    </linearGradient>
    <linearGradient id="gG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="100%" stop-color="rgba(0,188,212,0.1)"/>
    </linearGradient>
    <filter id="gl" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Hexágono -->
  <g transform="translate(24,24)">
    <polygon points="0,-21 18.2,-10.5 18.2,10.5 0,21 -18.2,10.5 -18.2,-10.5"
             fill="url(#gM)" stroke="url(#gG)" stroke-width="0.5"/>
  </g>

  <!-- Monograma C&C compacto -->
  <g transform="translate(24,24)" filter="url(#gl)">
    <!-- C izq (Carlos/código) -->
    <path d="M -1,-7 C -7,-7 -10,-4 -10,0 C -10,4 -7,7 -1,7"
          fill="none" stroke="#00bcd4" stroke-width="2.2" stroke-linecap="round"/>
    <!-- C der (Cristina/contable) -->
    <path d="M 1,-7 C 7,-7 10,-4 10,0 C 10,4 7,7 1,7"
          fill="none" stroke="#f1f5f9" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Nexo central -->
    <circle cx="0" cy="0" r="1.5" fill="#00bcd4"/>
    <circle cx="0" cy="0" r="0.7" fill="#f1f5f9"/>
  </g>
</svg>