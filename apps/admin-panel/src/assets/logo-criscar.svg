<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <!-- Gradiente principal Navy → Cyan -->
    <linearGradient id="gradMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2248"/>
      <stop offset="50%" stop-color="#3768ab"/>
      <stop offset="100%" stop-color="#00bcd4"/>
    </linearGradient>

    <!-- Gradiente inverso Cyan → Navy -->
    <linearGradient id="gradReverse" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00bcd4"/>
      <stop offset="40%" stop-color="#3768ab"/>
      <stop offset="100%" stop-color="#0f2248"/>
    </linearGradient>

    <!-- Gradiente para el glow cyan -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00bcd4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#00bcd4" stop-opacity="0"/>
    </radialGradient>

    <!-- Gradiente glass para el hexágono -->
    <linearGradient id="gradGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.15)"/>
      <stop offset="50%" stop-color="rgba(255,255,255,0.05)"/>
      <stop offset="100%" stop-color="rgba(0,188,212,0.1)"/>
    </linearGradient>

    <!-- Filtro glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Filtro glow fuerte para acentos -->
    <filter id="glowStrong" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Clip hexagonal -->
    <clipPath id="hexClip">
      <polygon points="200,28 347,113 347,287 200,372 53,287 53,113"/>
    </clipPath>

    <!-- Patrón circuit board sutil -->
    <pattern id="circuit" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <line x1="0" y1="20" x2="40" y2="20" stroke="#00bcd4" stroke-opacity="0.04" stroke-width="0.5"/>
      <line x1="20" y1="0" x2="20" y2="40" stroke="#00bcd4" stroke-opacity="0.04" stroke-width="0.5"/>
      <circle cx="20" cy="20" r="1.5" fill="#00bcd4" fill-opacity="0.06"/>
    </pattern>
  </defs>

  <!-- === CAPA 0: Fondo oscuro (para preview, removible) === -->
  <rect width="400" height="400" rx="32" fill="#0C1120"/>

  <!-- === CAPA 1: Glow ambiental === -->
  <ellipse cx="160" cy="170" rx="120" ry="120" fill="url(#glowCyan)" opacity="0.5"/>
  <ellipse cx="260" cy="250" rx="100" ry="100" fill="#3768ab" opacity="0.08"/>

  <!-- === CAPA 2: Hexágono exterior (forma base) === -->
  <g transform="translate(200,200)">
    <!-- Sombra del hexágono -->
    <polygon points="0,-172 149,-86 149,86 0,172 -149,86 -149,-86"
             fill="#0f2248" opacity="0.4" transform="translate(3,5)"/>

    <!-- Hexágono principal con gradiente -->
    <polygon points="0,-172 149,-86 149,86 0,172 -149,86 -149,-86"
             fill="url(#gradMain)" stroke="url(#gradGlass)" stroke-width="1.5"/>

    <!-- Patrón circuit dentro del hex -->
    <polygon points="0,-172 149,-86 149,86 0,172 -149,86 -149,-86"
             fill="url(#circuit)" clip-path="url(#hexClip)"/>

    <!-- Borde luminoso superior (liquid glass) -->
    <line x1="-130" y1="-78" x2="130" y2="-78"
          stroke="white" stroke-opacity="0.12" stroke-width="1"
          stroke-linecap="round"/>
  </g>

  <!-- === CAPA 3: Hexágono interior (marco glass) === -->
  <g transform="translate(200,200)">
    <polygon points="0,-138 120,-69 120,69 0,138 -120,69 -120,-69"
             fill="none" stroke="#00bcd4" stroke-opacity="0.2" stroke-width="0.75"/>
  </g>

  <!-- === CAPA 4: Monograma C & C entrelazado === -->
  <g transform="translate(200,200)" filter="url(#glow)">

    <!-- C de Carlos (izquierda) — con terminaciones de código </> -->
    <g transform="translate(-38, 0)">
      <!-- Arco principal de la C -->
      <path d="M 30,-52 C -5,-52 -32,-30 -32,0 C -32,30 -5,52 30,52"
            fill="none" stroke="#00bcd4" stroke-width="7" stroke-linecap="round"/>

      <!-- Bracket de código < en el extremo superior -->
      <path d="M 30,-52 L 18,-42 L 30,-32"
            fill="none" stroke="#00bcd4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
            opacity="0.8"/>

      <!-- Bracket de código > en el extremo inferior -->
      <path d="M 30,52 L 42,42 L 30,32"
            fill="none" stroke="#00bcd4" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
            opacity="0.8"/>

      <!-- Slash / diagonal (developer symbol) -->
      <line x1="25" y1="-20" x2="10" y2="20"
            stroke="#00bcd4" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
    </g>

    <!-- C de Cristina (derecha) — con elementos contables -->
    <g transform="translate(38, 0) scale(-1,1)">
      <!-- Arco principal de la C (espejada) -->
      <path d="M 30,-52 C -5,-52 -32,-30 -32,0 C -32,30 -5,52 30,52"
            fill="none" stroke="#f1f5f9" stroke-width="7" stroke-linecap="round"/>

      <!-- Signo $ sutil en el extremo superior -->
      <g transform="translate(30,-52) scale(0.6)" opacity="0.7">
        <line x1="0" y1="-8" x2="0" y2="8" stroke="#f1f5f9" stroke-width="3" stroke-linecap="round"/>
        <path d="M 5,-4 C 5,-7 -5,-7 -5,-4 C -5,-1 5,-1 5,2 C 5,5 -5,5 -5,2"
              fill="none" stroke="#f1f5f9" stroke-width="2.5" stroke-linecap="round"/>
      </g>

      <!-- Líneas de balance (ledger lines) en el extremo inferior -->
      <g transform="translate(22, 42)" opacity="0.5">
        <line x1="0" y1="0" x2="16" y2="0" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round"/>
        <line x1="0" y1="6" x2="16" y2="6" stroke="#f1f5f9" stroke-width="2" stroke-linecap="round"/>
        <line x1="10" y1="-3" x2="10" y2="9" stroke="#f1f5f9" stroke-width="1.5" stroke-linecap="round"/>
      </g>
    </g>

    <!-- Punto de intersección central (nexo) — ampersand implícito -->
    <circle cx="0" cy="0" r="5" fill="#00bcd4" filter="url(#glowStrong)"/>
    <circle cx="0" cy="0" r="2.5" fill="#f1f5f9"/>

    <!-- Línea de conexión entre las dos C (puente) -->
    <line x1="-8" y1="0" x2="8" y2="0"
          stroke="#00bcd4" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
  </g>

  <!-- === CAPA 5: Anillo orbital (innovación, movimiento) === -->
  <g transform="translate(200,200)">
    <ellipse cx="0" cy="0" rx="105" ry="30"
             fill="none" stroke="url(#gradReverse)" stroke-width="1.5"
             transform="rotate(-25)" opacity="0.35"/>
    <!-- Nodo en el anillo -->
    <circle cx="95" cy="-32" r="3" fill="#00bcd4" opacity="0.7"/>
    <circle cx="-88" cy="38" r="2" fill="#3768ab" opacity="0.5"/>
  </g>

  <!-- === CAPA 6: Texto inferior === -->
  <g transform="translate(200, 340)">
    <!-- Línea decorativa -->
    <line x1="-60" y1="-12" x2="-20" y2="-12" stroke="#00bcd4" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="20" y1="-12" x2="60" y2="-12" stroke="#00bcd4" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="0" cy="-12" r="2" fill="#00bcd4" opacity="0.5"/>

    <!-- Nombre -->
    <text text-anchor="middle" y="6"
          font-family="Geist, Inter, system-ui, sans-serif" font-size="13" font-weight="600"
          letter-spacing="4" fill="#94a3b8">
      C &amp; C
    </text>

    <!-- Subtítulo -->
    <text text-anchor="middle" y="22"
          font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="400"
          letter-spacing="2.5" fill="#64748b">
      SYSTEMS
    </text>
  </g>

  <!-- === CAPA 7: Partículas decorativas (profundidad) === -->
  <circle cx="85" cy="95" r="1.5" fill="#00bcd4" opacity="0.3"/>
  <circle cx="320" cy="120" r="1" fill="#00bcd4" opacity="0.25"/>
  <circle cx="70" cy="290" r="1.2" fill="#3768ab" opacity="0.3"/>
  <circle cx="340" cy="310" r="1.8" fill="#00bcd4" opacity="0.2"/>
  <circle cx="310" cy="80" r="0.8" fill="#f1f5f9" opacity="0.15"/>
  <circle cx="100" cy="330" r="1" fill="#3768ab" opacity="0.2"/>
</svg>